repos:
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: uv run verify --only basedpyright
        language: system
        pass_filenames: false
        always_run: true
      - id: basedpyright-skills
        name: basedpyright skills
        entry: uv run verify --only "basedpyright skills"
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run verify --only "ruff check"
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format
        entry: uv run verify --only "ruff format"
        language: system
        pass_filenames: false
        always_run: true
      - id: file-size
        name: file size
        entry: uv run verify --only "file size"
        language: system
        pass_filenames: false
        always_run: true
      - id: materials-table
        name: materials table
        entry: uv run verify --only "materials table"
        language: system
        pass_filenames: false
        always_run: true
      - id: api-types
        name: api types
        entry: uv run verify --only "api types"
        language: system
        pass_filenames: false
        files: ^(src/cad/|tools/gen_ts\.py|web/(package-lock\.json|src/api/))
      - id: web-lint
        name: web lint
        entry: uv run verify --only "web lint"
        language: system
        pass_filenames: false
        files: ^(web/|tools/(web|gen_ts)\.py)
      - id: web-test
        name: web test
        entry: uv run verify --only "web test"
        language: system
        pass_filenames: false
        files: ^(web/|tools/(web|gen_ts)\.py)
      - id: web-build
        name: web build
        entry: uv run verify --only "web build"
        language: system
        pass_filenames: false
        files: ^(web/|tools/(web|gen_ts)\.py)
      - id: protocol-models
        name: protocol models
        entry: uv run verify --only "protocol models"
        language: system
        pass_filenames: false
        files: ^(src/cad/checks/(lanes|job_store|jobs)\.py|src/cad/sandbox/container\.py|src/cad/confirmations/|src/cad/records/signed\.py|\.claude/skills/protocol-models/)
      - id: sandbox-image
        name: sandbox image
        entry: uv run verify --only "sandbox image"
        language: system
        pass_filenames: false
        always_run: true
        # Slow: CI runs it on every PR. Run it here with `uvx pre-commit run --hook-stage manual`.
        stages: [manual]
      - id: pytest
        name: pytest
        entry: uv run verify --only pytest
        language: system
        pass_filenames: false
        always_run: true
        # Slow: CI runs it on every PR. Run it here with `uvx pre-commit run --hook-stage manual`.
        stages: [manual]
      - id: app
        name: app
        entry: uv run verify --only app
        language: system
        pass_filenames: false
        always_run: true
        # Slow: CI runs it on every PR. Run it here with `uvx pre-commit run --hook-stage manual`.
        stages: [manual]
