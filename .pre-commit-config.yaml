repos:
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: uv run verify --only basedpyright
        language: system
        pass_filenames: false
        always_run: true
      - id: basedpyright-skills
        name: basedpyright skills
        entry: uv run verify --only "basedpyright skills"
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run verify --only "ruff check"
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format
        entry: uv run verify --only "ruff format"
        language: system
        pass_filenames: false
        always_run: true
      - id: file-size
        name: file size
        entry: uv run verify --only "file size"
        language: system
        pass_filenames: false
        always_run: true
      - id: materials-table
        name: materials table
        entry: uv run verify --only "materials table"
        language: system
        pass_filenames: false
        always_run: true
      - id: sandbox-image
        name: sandbox image
        entry: uv run verify --only "sandbox image"
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: uv run verify --only pytest
        language: system
        pass_filenames: false
        always_run: true
      - id: app
        name: app
        entry: uv run verify --only app
        language: system
        pass_filenames: false
        always_run: true
