[project]
name = "cad"
version = "0.1.0"
description = "Local MCP server where an agent builds CAD variants in a sandbox and fixed checks score them."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1,<2",
    "mcp==2.3.0",
    "packaging>=24",
    "pint>=0.24",
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6",
]

[project.scripts]
verify = "cad.verify.__main__:main"
cad-server = "cad.server.__main__:main"
cad-call = "cad.server.call:main"
cad-http = "cad.server.hosted:main"
cad-token = "cad.accounts.local:main"
cad-sandbox = "cad.sandbox.__main__:main"

[dependency-groups]
dev = [
    "basedpyright>=1.40,<1.41",
    "cadquery-ocp-novtk==7.9.3.1.1",
    "import-linter>=2.16",
    "jsonschema>=4.26.0",
    "pdfminer-six>=20250506",
    "playwright>=1.64.1",
    "pypdf>=5",
    "pypdfium2>=4",
    "pytest>=8",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff==0.17.4",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
exclude = [
    "proto",
    "**/.*",
    "**/__pycache__",
    "tests/sandbox/parts",
    "evals/bakeoff/grade.py",
    "evals/bakeoff/runs",
]
venvPath = "."
venv = ".venv"
extraPaths = ["src", "tools", "evals/bakeoff", "evals/briefs", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["proto", "evals/bakeoff/grade.py", "evals/bakeoff/runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "INP", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Every directory under src/cad is a package with an __init__.py. Scripts and tests are not.
"!src/**" = ["INP001"]

[tool.importlinter]
root_package = "cad"

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
containers = ["cad"]
exhaustive = true
unmatched_ignore_imports_alerting = "error"
layers = [
    "server | verify",
    "chat",
    "operations",
    "confirmations | selections | agent_measurements",
    "auto | accounts",
    "scorecard",
    "context_parts",
    "variant_sets",
    "research",
    "briefs",
    "projects",
    "conversations",
    "loads | geometry",
    "checks",
    "variants",
    "records",
    "sandbox",
    "tables | knowledge | web",
    "errors | data_root | frozen",
]
# Each line is an upward import that is still there. The list only shrinks: fix a new upward
# import instead of adding it here. A line that no longer matches an import fails the step.
ignore_imports = [
    # HTTP routes that run operations and chat: these go when the modules move up to server.
    "cad.confirmations.web -> cad.operations.confirmation",
    "cad.confirmations.web -> cad.operations.model",
    "cad.confirmations.web -> cad.operations.registry",
    "cad.confirmations.web -> cad.operations.routes",
    "cad.operations.outside -> cad.chat.log",
    "cad.operations.outside -> cad.chat.routes",
    # The run records in conversations.store go when they move into auto.
    "cad.conversations.store -> cad.auto.log",
    "cad.conversations.store -> cad.auto.model",
    # The answer record the brief and context-part stores write goes when it moves below briefs.
    "cad.briefs.edits -> cad.confirmations.answers",
    "cad.briefs.store -> cad.confirmations.answers",
    "cad.context_parts.store -> cad.confirmations.answers",
    # context_parts.ids imports nothing: these go when it moves below checks.
    "cad.briefs.model -> cad.context_parts.ids",
    "cad.checks.jobs -> cad.context_parts.ids",
    # projects.membership reads the brief store: these go when it moves into briefs.
    "cad.projects.membership -> cad.briefs.model",
    "cad.projects.membership -> cad.briefs.store",
    # The host side of the sandbox runs checks and builds: these go when it moves above checks.
    "cad.sandbox.__main__ -> cad.variants.entry",
    "cad.sandbox.host -> cad.checks.report",
    "cad.sandbox.host -> cad.checks.result",
    "cad.sandbox.host -> cad.variants.entry",
    # These go when PendingCheck moves next to CheckResult in checks.result and MaterialPinned
    # moves into variant_sets.
    "cad.research.requests -> cad.scorecard.model",
    "cad.variant_sets.placement -> cad.scorecard.material",
    # This goes when person_said moves out of the chat log, or briefs.source into operations.
    "cad.briefs.source -> cad.chat.log",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
# A hung test fails with its name and every thread's stack. The signal method
# cannot interrupt a test blocked in a worker thread, so use the thread method.
timeout = 300
timeout_method = "thread"
pythonpath = [
    "tests",
    "tools",
    "evals/bakeoff",
    "evals/briefs",
    "tests/evals",
    "tests/checks",
    "tests/fea",
    "tests/agent_measurements",
]
