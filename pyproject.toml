[project]
name = "cad"
version = "0.1.0"
description = "Local MCP server where an agent builds CAD variants in a sandbox and fixed checks score them."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
verify = "cad.verify.__main__:main"

[dependency-groups]
dev = [
    "basedpyright>=1.40,<1.41",
    "pytest>=8",
    "ruff==0.17.4",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests", "tools"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
