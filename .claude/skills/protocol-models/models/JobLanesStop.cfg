\* One server, one caller that keeps polling and reads the scorecard: one clean stop, two
\* crashes (a deploy during a check, and a stop that a SIGKILL cuts short), one failed run and
\* one replaced revision. Checks the rules and that every job converges.
SPECIFICATION Spec
CONSTANTS
    Procs = {p1}
    Callers = {c1}
    Cap = 2
    MaxCrashes = 2
    MaxFaults = 1
    MaxStops = 1
    Sets = 1
    Peeks = TRUE
    MaxTampers = 0
INVARIANTS
    TypeOK
    OneContainerPerKey
    NeverTrustForged
    CapStopsReruns
    QueuedIsCurrent
    KeptWhileShown
    NotifiedAfterStore
    InterruptedMeansInterrupted
    PeekMeansInterrupted
PROPERTIES
    Converges
    PendingEnds
    PeekPendingMeansRunning
