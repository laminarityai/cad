\* Two conversations on one project, two answers, two proposals, two asks, two messages, one
\* crash, one switch back to Plan and one extra on_recorded call. Safety only; CarryOnLive
\* checks the temporal properties.
SPECIFICATION Spec
CONSTANTS
    Convs = {c1, c2}
    MaxAnswers = 2
    MaxProposals = 2
    MaxAsks = 2
    MaxMessages = 2
    MaxCrashes = 1
    MaxSwitches = 1
    MaxExtraHooks = 1
    CutBetween = FALSE
SYMMETRY Conversations
INVARIANTS
    TypeOK
    OneTurnPerDelivery
    NoAnswerToldTwice
PROPERTIES
    NoDeliveryWhileRunning
    PlanEndsOnlyOnAnEdge
    PendingAskKeepsPlan
    PlanEndsOncePerConfirm
