\* One server, one caller that keeps polling and reads the scorecard: enough crashes to reach
\* the attempt cap, one failed run and one tamper. Checks the rules and that every job
\* converges. JobLanesStop.cfg adds the clean stop.
SPECIFICATION Spec
CONSTANTS
    Procs = {p1}
    Callers = {c1}
    Cap = 2
    MaxCrashes = 3
    MaxFaults = 1
    MaxStops = 0
    Sets = 1
    Peeks = TRUE
    MaxTampers = 1
INVARIANTS
    TypeOK
    OneContainerPerKey
    NeverTrustForged
    CapStopsReruns
    QueuedIsCurrent
    KeptWhileShown
    NotifiedAfterStore
    InterruptedMeansInterrupted
    PeekMeansInterrupted
PROPERTIES
    Converges
    PendingEnds
    PeekPendingMeansRunning
