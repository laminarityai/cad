\* One server, one caller that keeps polling: enough crashes to reach the attempt cap, one
\* failed run and one tamper. Checks the rules and that every job converges.
SPECIFICATION Spec
CONSTANTS
    Procs = {p1}
    Callers = {c1}
    Cap = 2
    MaxCrashes = 3
    MaxFaults = 1
    MaxTampers = 1
INVARIANTS
    TypeOK
    OneContainerPerKey
    NeverTrustForged
    InterruptedMeansInterrupted
PROPERTIES
    Converges
    PendingEnds
