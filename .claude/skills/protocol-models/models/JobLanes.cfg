\* One server, two concurrent score_variant calls: one crash, one failed run, one tamper, and a
\* variant two sets show. Checks the rules in every interleaving. JobLanesCap.cfg checks
\* convergence and the clean stop.
SPECIFICATION Spec
CONSTANTS
    Procs = {p1}
    Callers = {c1, c2}
    Cap = 2
    MaxCrashes = 1
    MaxFaults = 1
    MaxStops = 0
    Sets = 2
    Peeks = FALSE
    MaxTampers = 1
INVARIANTS
    TypeOK
    OneContainerPerKey
    NeverTrustForged
    CapStopsReruns
    QueuedIsCurrent
    KeptWhileShown
    NotifiedAfterStore
    InterruptedMeansInterrupted
