\* One conversation with fairness on the loop's own steps and on the stream reopening. A second
\* conversation adds no way for an answer to go untold, because each conversation's cursor and
\* channel are its own; it only multiplies the states.
SPECIFICATION LiveSpec
CONSTANTS
    Convs = {c1}
    MaxAnswers = 2
    MaxProposals = 2
    MaxAsks = 2
    MaxMessages = 1
    MaxCrashes = 1
    MaxSwitches = 0
    MaxExtraHooks = 0
    CutBetween = FALSE
INVARIANTS
    OneTurnPerDelivery
    NoAnswerToldTwice
PROPERTIES
    EveryAnswerTold
    EveryDeliveryRuns
