# Fastener holes by exact metric size. A check reads a row by its exact key and nothing else.
# clearance: ISO 273 hole diameters, close (fine series), medium and coarse series, in mm.
# tapped: the minor diameter of an internal thread, from its smallest to its 6H largest, and the
# tap drill, in mm. The coarse pitch is the one ISO 261 gives the size.
# Every quote is on a page of the stored text in tables/datasheet_text/, and every number is
# written in its quote: `uv run python -m cad.tables.validate` checks both offline.
sources:
  clearance: &clearance
    url: https://alb02.internal.nbk1560.com/en/resources/other/article/technical-20-diameter-of-clearance-holes-and-counterbores-for-bolts-and-screws
    title: "NBK, technical article: Diameter of Clearance Holes and Counterbores for Bolts and Screws (the table follows ISO 273)"
    page: the table of bolt hole diameters, the row of the nominal thread diameter; Grade 1, Grade 2 and Grade 3 are the close, medium and coarse series
    retrieved: 2026-11-11
    standard: ISO 273
  tapped: &tapped
    url: https://amesweb.info/Screws/metric-tap-drill-chart.aspx
    title: AmesWeb, Metric Tap Drill Chart (coarse thread)
    page: Metric Tap Drill Chart - Coarse Thread, the row of the tap size; columns 6H max, the 5H 6H 7H min minor diameter, and the drill size
    retrieved: 2026-11-11
    standard: ISO 68-1, ISO 2306

fasteners:
  - key: M2
    clearance:
      close_mm: 2.2
      medium_mm: 2.4
      coarse_mm: 2.6
      source:
        <<: *clearance
        quote: "2 2.2 2.4 2.6"
    tapped:
      minor_min_mm: 1.567
      minor_max_mm: 1.679
      tap_drill_mm: 1.6
      source:
        <<: *tapped
        quote: "M2 x 0.4 2 0.4 1.657 1.679 - 1.567 1.60"

  - key: M3
    clearance:
      close_mm: 3.2
      medium_mm: 3.4
