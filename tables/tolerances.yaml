# Tolerances a person may pick for a plain hole, by exact class key. A check reads a class by its
# exact key and the row whose size range holds the hole's diameter, and nothing else.
# H7, H8, H9 and H11 are hole tolerance classes of ISO 286-1: the hole basis H, which starts at the
# nominal size, with the width of the grade IT7, IT8, IT9 or IT11. ASME B4.2 uses these classes for
# its metric preferred fits, so they are the ASME tolerance chart of a product that works in mm.
# ISO 2768-f, ISO 2768-m and ISO 2768-c are the fine, medium and coarse classes of the general
# tolerances of ISO 2768-1 for linear sizes: the hole may be that far over or under its nominal
# size. ASME B4.1 (inch fits) and ASME Y14.5 are not here: the product works in mm.
# A row holds a size range (over_mm < size <= up_to_mm, or from over_mm when includes_over) and
# the limit the source prints for it, in the class unit. `quote` carries the limit, and the range
# when `range_quote` is absent. Every quote is on a page of the stored text in
# tables/datasheet_text/, and every number is written in its quote:
# `uv run python -m cad.tables.validate` checks both offline.
sources:
  it_grades: &it_grades
    url: https://en.wikipedia.org/wiki/IT_Grade
    title: "Wikipedia, IT Grade: ISO 286 Table 1, the international tolerance grades IT01 to IT18"
    page: "ISO 286 - Table 1; a row is the nominal size range over and up to, then IT01 to IT11 in micrometres (the columns in mm follow)"
    retrieved: 2026-11-11
    standard: ISO 286-1
  general: &general
    url: https://amesweb.info/fits-tolerances/iso-2768-linear-dimensions-tolerances.aspx
    title: "AmesWeb, ISO 2768-1 Linear Dimensions Tolerance Table: permissible deviations for linear dimensions"
    page: "Permissible deviations for basic size ranges, linear dimensions: the header row of ranges, then the row of the class f, m or c, in mm, plus or minus"
    retrieved: 2026-11-11
    standard: ISO 2768-1

